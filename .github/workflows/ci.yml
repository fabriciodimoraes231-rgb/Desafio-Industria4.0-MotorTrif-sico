name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov pytest-mock httpx
      - run: python -m pytest --cov=services --cov-report=term
